# Offers for pique-life — structured data consumed by the site.
# Kept out of the page's YAML frontmatter so GitHub renders it as
# readable source rather than collapsing it into a nested table.
# Structured offers — rendered as the deal list at the top of the page.
# type: code | deal   status: active | unverified | expired
# Keep this block free of blank lines; see scripts/validate.py.
offers:
  - id: pique-subscribe-save
    title: "Subscribe & Save 10–20% on every recurring order"
    type: deal
    discount: "Up to 20%"
    code: null
    status: active
    terms: "Discount is applied automatically at checkout. Most teas and single products save 10%; supplements and bundles save 15–20%. No minimum purchase. Cancel or skip anytime."
  - id: pique-free-shipping-100
    title: "Free US shipping on orders over $100"
    type: deal
    discount: "Free shipping"
    code: null
    status: active
    terms: "US delivery addresses only. Excludes Nandaka, Daily Radiance, Radiant Skin Duo and Pu'er bundle subscriptions. Orders under $100 ship USPS at a $9 flat rate."
  - id: pique-newsletter-10
    title: "10% off your first order when you join the email list"
    type: code
    discount: "10%"
    code: "Emailed after signup"
    status: active
    terms: "One-time code sent to new subscribers. First order only; typically does not stack with other codes."
  - id: pique-referral
    title: "Refer a friend: they get $10 off or a free sample pack, you get credit"
    type: deal
    discount: "$10 off / $70 credit"
    code: null
    status: active
    terms: "New customers only. Referrer earns 2,000 Pique Rewards points or a $70 account credit depending on the link used; the credit posts to 'My Referral Rewards' about 7 days after the friend's first order."
  - id: pique-rewards
    title: "Pique Rewards: 5 points per $1 spent"
    type: deal
    discount: "Loyalty points"
    code: null
    status: active
    terms: "Free to join. Points redeem for cash vouchers, tea accessories and product rewards, and stack on top of subscription pricing."
  - id: pique-happiness-guarantee
    title: "90-Day Happiness Guarantee with free return shipping"
    type: deal
    discount: "Risk-free"
    code: null
    status: active
    terms: "Return any purchase within 90 days for a full refund. Pique provides a prepaid return label."
