# Monetization map for couponcodeseeker.com
#
# Merchant pages never contain a raw tracking URL. Body anchors point at the
# internal path /go/<slug>, and the site resolves that here at redirect time.
# Switching networks or refreshing tracking parameters is then a one-line edit
# in this file instead of a find-and-replace across every merchant page.
#
# Deep links: /go/<slug>?to=/products/matcha-green-tea sends the shopper to that
# specific page on the merchant's site with tracking applied, so anchor text in
# the middle of a paragraph can point somewhere more useful than the homepage.
#
# Resolution rules the redirect endpoint must implement:
#   1. status: active   -> build the tracking URL from `url`, substituting
#                          {dest} with the URL-encoded destination
#                          (`fallback` + the ?to= path, or `fallback` alone).
#   2. anything else    -> 302 straight to `fallback` + ?to= path, untracked.
#      A page therefore never carries a broken or dead link just because the
#      affiliate link has not been set up yet.
#   3. Reject a ?to= value that is not a same-site absolute path beginning with
#      a single "/" — never redirect to an arbitrary attacker-supplied host.
#
# The endpoint should also send `rel` on the rendered anchor, return 302 (never
# 301, so a network change is not cached in browsers), and be disallowed in
# robots.txt so /go/ is never crawled or indexed.

version: 1

defaults:
  rel: "sponsored nofollow noopener"
  target: "_blank"
  redirect_status: 302
  disclosure: "We may earn a commission when you buy through links on this page. It never changes the price you pay or which offers we list."

merchants:
  pique-life:
    status: unconfigured # -> active once `url` is filled in
    network: "" # e.g. impact, shareasale, awin, cj
    url: "" # tracking template; {dest} is replaced with the encoded destination
    fallback: https://www.piquelife.com
    notes: |
      Deep links used in the page copy:
        /go/pique-life
        /go/pique-life?to=/collections/subs-collection
        /go/pique-life?to=/products/matcha-green-tea
        /go/pique-life?to=/pages/piquerewards
      Confirm the network permits deep linking before setting status: active.
      If it does not, the redirect still resolves — every ?to= simply lands on
      the tracked homepage.
