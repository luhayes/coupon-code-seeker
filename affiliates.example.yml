    url: ""
    fallback: https://ritual.com
  vahdam-teas:
    status: unconfigured
    network: ""
    url: ""
    fallback: https://www.vahdam.com
    notes: |
      Vahdam runs separate US/UK/DE/IN storefronts. Confirm the tracking link
      targets the US store before setting status: active.
  seed:
    status: unconfigured
    network: ""
    url: ""
    fallback: https://seed.com
  trade-coffee:
    status: unconfigured
    network: ""
    url: ""
    fallback: https://www.drinktrade.com
  vital-proteins:
    status: unconfigured
    network: ""
    url: ""
    fallback: https://www.vitalproteins.com
  moon-juice:
    status: unconfigured
