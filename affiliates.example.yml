      French market, EUR. Confirm the link targets beautysuccess.fr and not a
      Groupe NOVI corporate domain.
  les-cotons-de-romane:
    status: unconfigured
    network: ""
    url: ""
    fallback: https://lescotonsderomane.com
    notes: |
      CRITICAL: several .shop look-alike domains copy this brand. The fallback is
      the domain the brand promotes from its own Instagram and TikTok. Verify any
      tracking link resolves to lescotonsderomane.com and nowhere else.
  feniko:
    status: unconfigured
    network: ""
    url: ""
    fallback: https://feniko.pl
    notes: |
      CONSUMER CREDIT, Poland, PLN. Lending affiliate programmes impose rules on
      how credit may be advertised — check the network's creative requirements and
      confirm this page's cost disclosures satisfy them. Re-check the RRSO on every
      verification pass; a stale rate on a credit page is a compliance exposure.
