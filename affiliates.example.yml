# Monetization map for couponcodeseeker.com — PUBLIC TEMPLATE
#
# This repository is public, so this file carries the schema and the merchant
# slugs only. It must never contain a real tracking URL or network name.
#
# Real values live in `affiliates.yml`, which is gitignored. Copy this file to
# that name and fill it in, or supply the links at runtime through environment
# variables (AFFILIATE_<SLUG_UPPER_SNAKE>) if your host prefers secrets over a
# file. scripts/validate.py fails the build if a committed affiliates file has
# a non-empty `url`.
#
# Merchant pages never contain a raw tracking URL. They link to the merchant's
# real URL, and the site swaps in the affiliate link at build time using
# data/links.json. Switching networks or refreshing tracking parameters is then
# a one-line edit in this file rather than a find-and-replace across every page.
#
# Resolution, per entry in data/links.json:
#   1. status: active   -> take that merchant's `url` template and substitute
#                          {dest} with the URL-encoded destination, which is
#                          `fallback` plus the entry's `dest` path. The result
#                          is the href — the reader goes straight to the
#                          affiliate link, with no redirect of our own.
#   2. anything else    -> leave the link exactly as written, pointing at the
#                          merchant. A page never carries a broken or dead link
#                          just because the affiliate link is not set up yet.
#
# The rendered anchor must carry `rel` (below). That matters more now than it
# did behind a redirect: the href is a tracking URL, and an unmarked paid link
# is what search engines penalise.

version: 1

defaults:
  rel: "sponsored nofollow noopener"
  target: "_blank"
  redirect_status: 302
  disclosure: "We may earn a commission when you buy through links on this page. It never changes the price you pay or which offers we list."

merchants:
  pique-life:
    status: unconfigured # -> active once `url` is filled in
    network: "" # e.g. impact, salegains, awin, cj
    url: "" # tracking template; {dest} is replaced with the encoded destination
    fallback: https://www.piquelife.com
  mudwtr:
    status: unconfigured
    network: ""
    url: ""
    fallback: https://mudwtr.com
