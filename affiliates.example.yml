    network: ""
    url: ""
    fallback: https://drinklmnt.com
    notes: |
      LMNT's free Sample Pack attaches through partner links specifically, so
      confirm the tracking link still triggers it — if it does not, the page's
      headline offer is wrong and needs rewriting.
  ritual:
    status: unconfigured
