# Offers for merchant — structured data consumed by the site.
# Kept out of the page's YAML frontmatter so GitHub renders it as
# readable source rather than collapsing it into a nested table.
# type: code | deal        status: active | unverified | expired
# Never leave a blank line anywhere inside this frontmatter block: parsers that
# end frontmatter at the first blank line will drop everything below it into the
# page body, where markdown collapses it into one run-on paragraph.
offers:
  - id: merchant-slug-offer-1
    title: ""
    label: ""                         # the table's Type column, e.g. Automatic, Guarantee, Referral
    type: deal
    discount: ""
    code: null                       # null when no code is required
    status: active
    access: "No code needed"           # how to get it when there is no code: Personal link, Free card...
    terms: ""                        # exclusions, minimums, new-customer limits
    # expires_on: YYYY-MM-DD           # optional; an active offer past this date fails validation
